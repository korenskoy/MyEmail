included:
  - MyEmail
  - MyEmailTests
  - MyEmailUITests

excluded:
  - .build
  - build
  - Package.swift

disabled_rules:
  - trailing_comma
  - opening_brace
  - todo
  - inclusive_language
  - multiple_closures_with_trailing_closure
  - implicit_optional_initialization

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 160
  error: 250
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 120

function_parameter_count:
  warning: 8
  error: 10

force_cast: warning

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - i
    - n
    - w
    - h
    - m
    - s

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60

nesting:
  type_level: 3
  function_level: 3

large_tuple:
  warning: 4
  error: 5
